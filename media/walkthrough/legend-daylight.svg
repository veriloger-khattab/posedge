<svg xmlns="http://www.w3.org/2000/svg" width="1140" height="460" viewBox="0 0 1140 460" font-family="'JetBrains Mono NL','JetBrains Mono',Consolas,monospace" font-size="14"><rect width="1140" height="460" rx="10" fill="#FBFAF7"/><rect x="24" y="29" width="14" height="14" rx="3" fill="#D02A10"/><text x="50" y="42" fill="#D02A10" font-weight="400" font-style="normal" text-decoration="none">Keywords</text><text x="290" y="42" fill="#565B61">class … endclass, module, function, begin … end, if/else, case</text><rect x="24" y="59" width="14" height="14" rx="3" fill="#6D4204"/><text x="50" y="72" fill="#6D4204" font-weight="400" font-style="italic" text-decoration="none">Modifiers (italic)</text><text x="290" y="72" fill="#565B61">virtual, local, protected, static, automatic, const, input, this, super</text><rect x="24" y="89" width="14" height="14" rx="3" fill="#AF5A00"/><text x="50" y="102" fill="#AF5A00" font-weight="400" font-style="normal" text-decoration="none">Macros and directives</text><text x="290" y="102" fill="#565B61">`ifdef, `define, `uvm_component_utils, `uvm_info, %0d, tool pragmas</text><rect x="24" y="119" width="14" height="14" rx="3" fill="#027897"/><text x="50" y="132" fill="#027897" font-weight="400" font-style="normal" text-decoration="none">Types</text><text x="290" y="132" fill="#565B61">bit, logic, int, string, apb_item, uvm_driver (library types italic)</text><rect x="24" y="149" width="14" height="14" rx="3" fill="#157648"/><text x="50" y="162" fill="#157648" font-weight="400" font-style="normal" text-decoration="none">Functions and tasks</text><text x="290" y="162" fill="#565B61">new, get_next_item(), $display (bold only where declared)</text><rect x="24" y="179" width="14" height="14" rx="3" fill="#424D00"/><text x="50" y="192" fill="#424D00" font-weight="400" font-style="normal" text-decoration="none">Strings</text><text x="290" y="192" fill="#565B61">"message text"</text><rect x="24" y="209" width="14" height="14" rx="3" fill="#844AD3"/><text x="50" y="222" fill="#844AD3" font-weight="400" font-style="normal" text-decoration="none">Numbers and constants</text><text x="290" y="222" fill="#565B61">8'hFF, 32, WIDTH, UVM_ALL_ON, null</text><rect x="24" y="239" width="14" height="14" rx="3" fill="#1A5CD0"/><text x="50" y="252" fill="#1A5CD0" font-weight="400" font-style="normal" text-decoration="none">Time and concurrency</text><text x="290" y="252" fill="#565B61">@(posedge clk), #10ns, ##2, fork … join_none, always_ff, wait, clk, rst_n</text><rect x="24" y="269" width="14" height="14" rx="3" fill="#045255"/><text x="50" y="282" fill="#045255" font-weight="400" font-style="normal" text-decoration="none">Verification</text><text x="290" y="282" fill="#565B61">assert, cover, property, covergroup, bins, constraint, rand, |-&gt;</text><rect x="24" y="299" width="14" height="14" rx="3" fill="#D3206A"/><text x="50" y="312" fill="#D3206A" font-weight="700" font-style="normal" text-decoration="none">Error (bold)</text><text x="290" y="312" fill="#565B61">`uvm_error("ID", …), $error, UVM_ERROR, illegal_bins</text><rect x="24" y="329" width="14" height="14" rx="3" fill="#D3206A"/><text x="50" y="342" fill="#D3206A" font-weight="700" font-style="normal" text-decoration="none">Fatal (bold)</text><text x="290" y="342" fill="#565B61">`uvm_fatal("ID", …), $fatal</text><rect x="24" y="359" width="14" height="14" rx="3" fill="#7B6300"/><text x="50" y="372" fill="#7B6300" font-weight="700" font-style="normal" text-decoration="none">Warning (bold)</text><text x="290" y="372" fill="#565B61">`uvm_warning("ID", …), $warning, TODO</text><rect x="24" y="389" width="14" height="14" rx="3" fill="#25282C"/><text x="50" y="402" fill="#25282C" font-weight="700" font-style="normal" text-decoration="none">Info (bold, neutral)</text><text x="290" y="402" fill="#565B61">`uvm_info("ID", …, UVM_LOW)</text><rect x="24" y="419" width="14" height="14" rx="3" fill="#696D70"/><text x="50" y="432" fill="#696D70" font-weight="400" font-style="normal" text-decoration="none">Comments</text><text x="290" y="432" fill="#565B61">// comment</text></svg>
